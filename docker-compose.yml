# Settings shared by every API service.
x-api: &api
  init: true
  environment:
    DATABASE_URL: postgres://api:api@postgres:5432/users
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    build: ./postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  pgadmin:
    build: ./pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  python-fastapi:
    <<: *api
    build: ./python-fastapi
    ports:
      - "8001:8080"

  node-express:
    <<: *api
    build: ./node-express
    ports:
      - "8002:8080"

  rust-axum:
    <<: *api
    build: ./rust-axum
    ports:
      - "8003:8080"

  go-gin:
    <<: *api
    build: ./go-gin
    ports:
      - "8004:8080"

volumes:
  pgdata:
