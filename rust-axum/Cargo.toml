[package]
name = "users-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["derive", "postgres", "runtime-tokio"] }
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread"] }
